[package]
name = "sawhorse-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library, contracts, routing, and provider adapters for sawhorse"

[lints]
workspace = true

[dependencies]
# Shared wire contracts; resolved locally through the meta-harness [patch.crates-io] mapping.
gaugeblock-contracts = "0.1.0-beta.1"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "time", "rt", "macros"] }
toml = "1.1"
tracing = "0.1"

# Catalog metadata (GB-217). `default-features = false` is deliberate: the crate's defaults pull
# reqwest 0.13 + tokio + directories, and sawhorse is on reqwest 0.12 - that would compile a second
# HTTP stack for a capability sawhorse already has, plus an ambient cache path. `cline` carries the
# curated ClinePass overlay; `bundled` compiles the snapshot in so no I/O is needed to read it.
models-catalog = { version = "0.1.0", default-features = false, features = ["cline", "bundled"], optional = true }

# Mode 1: Optional native embedded candle inference.
#
# KEPT WITH A REASON (GB-201): `miter deps` reports all three as unreferenced because no source
# file names them outside `#[cfg(feature = "candle")]`, which the scanner strips. They are feature
# enablement, not dead weight - the `candle` feature below wires them in, and deleting them would
# break `Mode 1` while still compiling the default build.
candle-core = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }

[features]
default = []
candle = ["dep:candle-core", "dep:candle-transformers", "dep:candle-nn"]
# Catalog-backed model limits (GB-217). Off by default so offline builds and existing tests keep
# their exact dependency graph; on, it adds a pure synchronous parser and the bundled snapshot.
catalog = ["dep:models-catalog"]

